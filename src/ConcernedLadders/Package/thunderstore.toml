[config]
schemaVersion = "0.0.1"

[package]
namespace = "TheConcernedCat"
name = "ConcernedBuilder"
versionNumber = "1.1.0"
description = "Building for basements and climbs: animated vertical ladders with a Climbing skill, plus trapdoors, bulkhead cellar doors, railings and an Iron Shovel that digs straight-sided basements. Formerly Concerned Ladders."
websiteUrl = "https://github.com/Weakened/ConcernedCatMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"
ValheimModding-Jotunn = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../../artifacts/thunderstore"

[[build.copy]]
source = "../bin/Release/net48/TheConcernedCat.ConcernedLadders.dll"
target = "plugins/TheConcernedCat.ConcernedLadders.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "building", "utility", "ai-generated"]
