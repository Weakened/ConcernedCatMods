[config]
schemaVersion = "0.0.1"

[package]
namespace = "TheConcernedCat"
name = "ConcernedSteward"
versionNumber = "0.1.0"
description = "Sunniva keeps the fuel-burning lights in the settlement you marked burning, with real fuel from the one chest you marked, and says what she needs. Off until you turn her on. Requires Concerned NPC."
websiteUrl = "https://github.com/Weakened/ConcernedCatMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2333"
ValheimModding-Jotunn = "2.29.2"
TheConcernedCat-ConcernedNPC = "0.4.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../../artifacts/thunderstore"

[[build.copy]]
source = "../bin/Release/net48/TheConcernedCat.ConcernedSteward.dll"
target = "plugins/TheConcernedCat.ConcernedSteward.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "client-side", "utility", "ai-generated"]
