[config]
schemaVersion = "0.0.1"

[package]
namespace = "TheConcernedCat"
name = "ConcernedNPC"
versionNumber = "0.1.0"
description = "The shared runtime behind Concerned Cat companions: identity, camp awareness, allowed containers, work areas, job planning and recovery. On its own it does nothing; install a Concerned Cat NPC mod."
websiteUrl = "https://github.com/Weakened/ConcernedCatMods"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2333"
ValheimModding-Jotunn = "2.29.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../../../artifacts/thunderstore"

[[build.copy]]
source = "../bin/Release/net48/TheConcernedCat.ConcernedNPC.dll"
target = "plugins/TheConcernedCat.ConcernedNPC.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "../../../LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "client-side", "utility", "ai-generated"]
