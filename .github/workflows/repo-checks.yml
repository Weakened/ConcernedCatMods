name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test reproducible package tooling
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Validate repository and package metadata
        run: python tools/validate_repo.py

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # #341: every step below runs a test project by PATH, so the solution
      # itself was never loaded and could be unloadable while CI stayed green -
      # which is exactly what happened. This asks MSBuild to load it, with
      # MSBuild's own rules: duplicate entry names (MSB5004), a nesting row
      # pointing at a project that is not there (MSB5009/MSB5023), a missing
      # format header (MSB5010), a missing EndProject (MSB5012) and leftover
      # merge-conflict markers all fail here. `dotnet sln list` is NOT a
      # substitute: it exits 0 on a solution MSBuild refuses.
      - name: Load the solution
        run: dotnet restore ConcernedCatMods.sln

      - name: Run pure-domain unit tests (Concerned Cartographer)
        run: dotnet test src/ConcernedCartographer.Tests/ConcernedCartographer.Tests.csproj --nologo

      - name: Run pure-domain unit tests (Concerned Teamster)
        run: dotnet test src/ConcernedTeamster.Tests/ConcernedTeamster.Tests.csproj --nologo

      - name: Run pure-domain unit tests (shared settlement, workers and interop)
        run: dotnet test src/Shared.Settlement.Tests/Shared.Settlement.Tests.csproj --nologo

      - name: Run two-assembly interop tests (concernedcat.haul/1)
        run: dotnet test src/Interop.Tests/Interop.Tests.csproj --nologo

      # CF-NPC-005: the Foreman adapters are linked into this project and
      # compiled against a stubbed Valheim surface, so the layer that touches
      # the game is covered here without the game being present.
      - name: Run adapter unit tests (Concerned Foreman)
        run: dotnet test src/ConcernedForeman.Tests/ConcernedForeman.Tests.csproj --nologo

      # CNPC-000 (#371): the shared NPC runtime's contracts are game-free, so
      # they run here like the domain suites rather than only on a machine with
      # the game installed.
      - name: Run contract tests (Concerned NPC)
        run: dotnet test src/ConcernedNPC.Tests/ConcernedNPC.Tests.csproj --nologo

      - name: Explain build boundary
        run: |
          echo "Game-linked C# builds are intentionally local or self-hosted."
          echo "Valheim assemblies are not stored in this repository."
