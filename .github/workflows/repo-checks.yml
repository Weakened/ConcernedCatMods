name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The tools/tests suites plant violations into the tree and run the whole
  # validator once per plant. Run one after another in a single job they had
  # grown to 3-4 hours. Each matrix job has its own checkout, so a plant in one
  # runner is invisible to the others, and the classes run in parallel.
  # The matrix is discovered, never hand-listed: a hand-written list would
  # silently stop running a test added later (tools/ci_plant_matrix.py).
  discover-plant-suites:
    runs-on: ubuntu-latest
    outputs:
      classes: ${{ steps.discover.outputs.classes }}
      total: ${{ steps.discover.outputs.total }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover test classes
        id: discover
        run: |
          echo "classes=$(python tools/ci_plant_matrix.py)" >> "$GITHUB_OUTPUT"
          echo "total=$(python tools/ci_plant_matrix.py --count)" >> "$GITHUB_OUTPUT"

  plant-suite:
    needs: discover-plant-suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.discover-plant-suites.outputs.classes) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ${{ matrix.class }}
        run: python -m unittest -v ${{ matrix.class }}

  # One stable check that is green only when discovery found suites and every
  # one of them passed. A skipped or cancelled matrix is a failure here.
  plant-suites:
    needs: [discover-plant-suites, plant-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every plant suite to have run and passed
        run: |
          echo "Discovered ${{ needs.discover-plant-suites.outputs.total }} tests"
          test "${{ needs.discover-plant-suites.result }}" = "success"
          test "${{ needs.plant-suite.result }}" = "success"
          test -n "${{ needs.discover-plant-suites.outputs.total }}"
          test "${{ needs.discover-plant-suites.outputs.total }}" -gt 0

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository and package metadata
        run: python tools/validate_repo.py

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # #341: every step below runs a test project by PATH, so the solution
      # itself was never loaded and could be unloadable while CI stayed green -
      # which is exactly what happened. This asks MSBuild to load it, with
      # MSBuild's own rules: duplicate entry names (MSB5004), a nesting row
      # pointing at a project that is not there (MSB5009/MSB5023), a missing
      # format header (MSB5010), a missing EndProject (MSB5012) and leftover
      # merge-conflict markers all fail here. `dotnet sln list` is NOT a
      # substitute: it exits 0 on a solution MSBuild refuses.
      - name: Load the solution
        run: dotnet restore ConcernedCatMods.sln

      - name: Run pure-domain unit tests (Concerned Cartographer)
        run: dotnet test src/ConcernedCartographer.Tests/ConcernedCartographer.Tests.csproj --nologo

      - name: Run pure-domain unit tests (Concerned Teamster)
        run: dotnet test src/ConcernedTeamster.Tests/ConcernedTeamster.Tests.csproj --nologo

      - name: Run game-free ladder geometry and traversal policy tests
        run: dotnet test src/ConcernedLadders.Tests/ConcernedLadders.Tests.csproj --nologo

      - name: Run pure-domain unit tests (shared settlement, workers and interop)
        run: dotnet test src/Shared.Settlement.Tests/Shared.Settlement.Tests.csproj --nologo

      - name: Run two-assembly interop tests (concernedcat.haul/1)
        run: dotnet test src/Interop.Tests/Interop.Tests.csproj --nologo

      # CF-NPC-005: the Foreman adapters are linked into this project and
      # compiled against a stubbed Valheim surface, so the layer that touches
      # the game is covered here without the game being present.
      - name: Run adapter unit tests (Concerned Foreman)
        run: dotnet test src/ConcernedForeman.Tests/ConcernedForeman.Tests.csproj --nologo

      # CNPC-000 (#371): the shared NPC runtime's contracts are game-free, so
      # they run here like the domain suites rather than only on a machine with
      # the game installed.
      - name: Run contract tests (Concerned NPC)
        run: dotnet test src/ConcernedNPC.Tests/ConcernedNPC.Tests.csproj --nologo

      - name: Explain build boundary
        run: |
          echo "Game-linked C# builds are intentionally local or self-hosted."
          echo "Valheim assemblies are not stored in this repository."
