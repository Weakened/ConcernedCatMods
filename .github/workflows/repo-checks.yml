name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository and package metadata
        run: python tools/validate_repo.py

      - name: Explain build boundary
        run: |
          echo "Game-linked C# builds are intentionally local or self-hosted."
          echo "Valheim assemblies are not stored in this repository."
